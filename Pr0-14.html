
<!DOCTYPE html>
<html>
<head>
    <title>Interactive Quiz Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            text-align: center;
            padding: 30px;
        }

        .quiz-container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #bbb;
        }

        h1 {
            color: #2874a6;
        }

        #question {
            font-size: 20px;
            margin: 20px 0;
        }

        .option {
            display: block;
            width: 90%;
            margin: 10px auto;
            padding: 12px;
            background: #eaf2f8;
            border: 1px solid #aed6f1;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
        }

        .option:hover {
            background: #d4e6f1;
        }

        .option.selected {
            background: #2874a6;
            color: white;
        }

        button {
            padding: 12px 25px;
            margin-top: 20px;
            background: #27ae60;
            color: rgb(12, 1, 1);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #219150;
        }

        #score {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>

<body>

    <div class="quiz-container">

        <h1>JavaScript Quiz</h1>

        <p id="progress">Question 1</p>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button onclick="nextQuestion()" id="nextBtn">
            Next
        </button>

        <p id="score"></p>

    </div>

    <script>

        // Quiz questions stored in an array
        const questions = [

            {
                question: "What does HTML stand for?",
                options: [
                    "Hyper Text Markup Language",
                    "High Text Machine Language",
                    "Hyper Tool Multi Language",
                    "Home Text Markup Language"
                ],
                answer: 0
            },

            {
                question: "Which language is used for styling web pages?",
                options: [
                    "HTML",
                    "CSS",
                    "Java",
                    "Python"
                ],
                answer: 1
            },

            {
                question: "Which language makes web pages interactive?",
                options: [
                    "CSS",
                    "HTML",
                    "JavaScript",
                    "SQL"
                ],
                answer: 2
            },

            {
                question: "Which symbol is used for comments in JavaScript?",
                options: [
                    "<!-- -->",
                    "//",
                    "#",
                    "**"
                ],
                answer: 1
            },

            {
                question: "Which method selects an HTML element by ID?",
                options: [
                    "getElementById()",
                    "getArray()",
                    "getStyle()",
                    "queryText()"
                ],
                answer: 0
            }

        ];

        // Variables
        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;

        // Function to display questions
        function displayQuestion() {

            let q = questions[currentQuestion];

            document.getElementById("progress").textContent =
                "Question " + (currentQuestion + 1) +
                " of " + questions.length;

            document.getElementById("question").textContent =
                q.question;

            let optionsDiv = document.getElementById("options");

            optionsDiv.innerHTML = "";

            selectedAnswer = null;

            // Display answer options
            q.options.forEach(function(option, index) {

                let btn = document.createElement("button");

                btn.textContent = option;
                btn.className = "option";

                btn.onclick = function() {

                    selectedAnswer = index;

                    // Highlight selected option
                    document.querySelectorAll(".option").forEach(
                        function(item) {
                            item.classList.remove("selected");
                        }
                    );

                    btn.classList.add("selected");
                };

                optionsDiv.appendChild(btn);

            });

            document.getElementById("nextBtn").textContent =
                currentQuestion === questions.length - 1 ?
                "Finish Quiz" : "Next";
        }

        // Function to move to the next question
        function nextQuestion() {

            if (selectedAnswer === null) {
                alert("Please select an answer!");
                return;
            }

            // Check the answer
            if (selectedAnswer === questions[currentQuestion].answer) {
                score++;
            }

            currentQuestion++;

            // Display next question or final score
            if (currentQuestion < questions.length) {

                displayQuestion();

            } else {

                document.getElementById("question").textContent =
                    "Quiz Completed!";

                document.getElementById("options").innerHTML = "";

                document.getElementById("progress").textContent =
                    "Thank you for participating!";

                document.getElementById("nextBtn").style.display =
                    "none";

                document.getElementById("score").textContent =
                    "Your Score: " + score + " / " + questions.length;
            }
        }

        // Start the quiz
        displayQuestion();

    </script>

</body>
</html>
